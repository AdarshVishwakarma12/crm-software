{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">

    <link rel="stylesheet" type="text/css" href="{% static 'accounts/base.css' %}">
    <link rel="stylesheet" type="text/css" href="{% static 'accounts/home.css' %}">
    {% block addCSSlink %}{% endblock addCSSlink %}

    {% block contentTitle %} {% endblock contentTitle %}
</head>
<body>

    
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
        <div class="blob blob-3"></div>
        <div class="blob blob-4"></div>
    </div>

      <header>

        <a href="{% url 'index' %}"> 
            <div class="left_nav">
                <img src="{% static 'accounts/icons/icon.svg' %}" alt="My Logo" height="50">
                <div class="img"> CRM </div>
            </div>
        </a>

        

        <div class="account-btn">
            {% if user.is_authenticated %}
                <a href="{% url 'appDashboard' %}">
                    <button class="go-apps-btn">
                        Go to Apps
                    </button>
                </a>
            {% endif %}
            <a href="#">
                <img  src="{% static 'accounts/icons/helpBtn.svg' %}">
            </a>
        </div>
    </header>

    {% block contentBody1 %}{% endblock contentBody1 %}

    <!-- JS files attached below -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
    <!-- JS files ended -->

    
    <!-- Extra JS Features ENDED -->

</body>
</html>
