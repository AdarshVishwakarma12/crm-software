<?xml version="1.0" encoding="UTF-8"?>
<svg width="200px" height="200px" viewBox="0 0 100 100"
     xmlns="http://www.w3.org/2000/svg" version="1.1">
    <title>Creative CRM Logo</title>
    <defs>
        <!-- Original gradients -->
        <linearGradient id="consoleGradient" x1="0%" y1="100%" x2="100%" y2="0%">
            <stop offset="0%" stop-color="#FF008A"/>
            <stop offset="50%" stop-color="#FF4D4D"/>
            <stop offset="100%" stop-color="#FF7A00"/>
        </linearGradient>
        
        <linearGradient id="coreGradient" x1="50%" y1="0%" x2="50%" y2="100%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#FFC4C4"/>
        </linearGradient>

        <!-- New: background gradient -->
        <radialGradient id="bgGradient" cx="50%" cy="50%" r="75%">
            <stop offset="0%" stop-color="#FFFFFF"/>
            <stop offset="100%" stop-color="#0d001a"/>
        </radialGradient>
    </defs>

    <!-- Cool gradient background -->
    <rect x="0" y="0" width="100" height="100" fill="url(#bgGradient)" />

    <g id="Logo" stroke="none" stroke-width="1" fill="none" fill-rule="evenodd">
        <!-- The main outer shape -->
        <path d="M 90,50 
            A 45,45 0 1 1 50,1 1
            A 30,30 0 1 0 80,50
            Z" fill="url(#consoleGradient)" />

        <!-- The inner 'core' element -->
        <rect x="12" y="18" width="80" height="54" fill="#000000" rx="1" />

        <!-- Console text -->
        <text x="23" y="54" font-family="monospace" font-size="25" fill="#FFFFFF">CRM_</text>
    </g>
</svg>